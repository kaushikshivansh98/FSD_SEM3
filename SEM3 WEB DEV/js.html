<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>my first javascript program</h2>
    <button onclick="runCode()">Run Code</button>
    <p id="result"></p>
    <script>
      function runCode() {
        let num1 = 10;
        let num2 = 5;
        let sum = num1 + num2;
        document.getElementById("result").innerText = "Sum is:" + sum;
      }
    </script>
    <h2>data type example</h2>
    <button onclick="runCode2()">Run Code</button>
    <p id="result2"></p>
    <script>
      function runCode2() {
        let age = 16;
        let name = "aman";
        let isStudent = true;
        document.getElementById("result2").innerText =
          "age type:" +
          typeof age +
          " " +
          "name type:" +
          typeof name +
          " " +
          "isStudent type:" +
          typeof isStudent;
      }
    </script>
    <h2>if-else example</h2>
    <button onclick="runCode4()">runCode</button>
    <p id="result4"></p>
    <script>
      function runCode4() {
        let marks = 75;
        if (marks >= 90) {
          document.getElementById("result4").innerText = "Grade: A";
        } else if (marks >= 60) {
          document.getElementById("result4").innerText = "Grade: A";
        } else {
          document.getElementById("result4").innerText = "Grade: C";
        }
      }
    </script>
    <h2>Function Example</h2>
    <button onclick="runCode5()">Run Code</button>
    <p id="result5"></p>
    <script>
      function runCode5() {
        let n;
        function addnum(x, y) {
          n = x + y;
        }
        let sum = addnum(5, 7);
        document.getElementById("result5").innerText = "addnum:=" + n;
      }
    </script>
    <h2>Arrays Example</h2>
    <button onclick="runCode6()">Run Code</button>
    <p id="result6"></p>
    <script>
      function runCode6() {
        let students = ["aman", "riya", "karan"];
        let first = students[0];
        let total = students.length;
        students.push("sneha");
        document.getElementById("result6").innerText =
          "first" +
          first +
          " | " +
          "total" +
          total +
          " | " +
          "after add " +
          students;
      }
    </script>
    <h2>name</h2>
    <button onclick="runcode7()">Run Code</button>
    <p id="result7"></p>
    <script>
      function runcode7() {
        //student is object
        let student = {
          name: "aman",
          age: 16,
          marks: 85,
        };
        let studentname = student.name;
        let studentage = student.age;
        student.marks = 90;
        document.getElementById("result7").innerText =
          "name: " +
          studentname +
          " | " +
          "age: " +
          studentage +
          " | " +
          "update marks: " +
          students.marks;
      }
    </script>
    <h2>Events Examples</h2>
    <button onclick="setupEvent()">Setup Event(run once)</button>
    <button id="clickMeBtn">Click me</button>
    <script>
      function setupEvent() {
        document
          .getElementById("clickMeBtn")
          .addEventListener("click", function () {
            alert("you clicke the button!");
          });
      }
    </script>
     <h2>Template Literals Example</h2> 
    <button onclick="runCode8()">Run Code</button>
    <p id="result8"></p>
     <script> 
    function runCode8() { 
 
      let name = "Riya"; 
      let marks = 88; 
 
      // old way: "Name: " + name + ", Marks: " + marks 
      // new way: use backticks ` ` and ${ } to insert variables directly 
      let message = `Name: ${name}, Marks: ${marks}`; 
 
      // showing result on the page 
      document.getElementById("result8").innerText = message; 
    } 
  </script>
 <h2>DOM Manipulation Example</h2> 
 
  <button onclick="runCode9()">Run Code</button> 
 
  <p id="demoText">This text will change when you click Run.</p> 
 
  <script> 
    function runCode9() { 
 
      // document.getElementById finds an element on the page by its id 
      // innerText changes the text shown 
      document.getElementById("demoText").innerText = "Hello! JavaScript changed this text."; 
      // style.color changes the text color 
      document.getElementById("demoText").style.color = "green"; 
    } 
  </script>
 <h2>Events Example</h2> 
  <button onclick="setupEvent()">Setup Event (run once)</button> 
  <button id="clickMeBtn">Click Me!</button> 
  <script> 
    function setupEvent() {  
      document.getElementById("clickMeBtn").addEventListener("click", function() 
      { 
        alert("You clicked the button!"); 
      }); 
    } 
  </script>
  <button id="btn">click me</button>
  <p id="output">hello</p>
  <script>
    document.getElementById("btn").addEventListener("click",()=>{
      document.getElementById("output").textContent="button was clicked!";
    });
  </script>
  <input type="text" id="nameinput" placeholder="enter your name">
  <p id="greet"></p>
  <script>
    const input=document.getElementById("nameinput");
    const greet=document.getElementById("greet");
    input.addEventListener("input", ()=>{
      greet.textContent= `hello,${input,value}!`;
    });
  </script>
  <ul id="tasklist">
    <li>sample task1</li>
    <li>sample task2</li>
  </ul>
  <script>
    document.getElementById("tasklist").addEventListener("click",(e)=>
  {
    if(e.target.tagname==="li"){
      e.target.remove();   
    }
  })
  </script>
  </body>
</html>
